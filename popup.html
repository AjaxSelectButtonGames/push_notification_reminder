<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      max-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
    }
    
    .header {
      background: #4285f4;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    
    .clear-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .clear-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .feed {
      max-height: 500px;
      overflow-y: auto;
    }
    
    .notification-item {
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s;
      position: relative;
    }
    
    .notification-item:hover {
      background: #fafafa;
    }
    
    .notification-item.unread {
      background: #e3f2fd;
    }
    
    .notification-item.unread::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #4285f4;
    }
    
    .notify-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    
    .notify-title {
      font-weight: 600;
      font-size: 14px;
      color: #202124;
      flex: 1;
    }
    
    .notify-time {
      font-size: 11px;
      color: #5f6368;
      margin-left: 8px;
      white-space: nowrap;
    }
    
    .notify-message {
      font-size: 13px;
      color: #5f6368;
      margin-bottom: 4px;
    }
    
    .notify-domain {
      font-size: 11px;
      color: #1a73e8;
    }
    
    .delete-btn {
      background: none;
      border: none;
      color: #5f6368;
      cursor: pointer;
      padding: 4px;
      margin-left: 8px;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    
    .notification-item:hover .delete-btn {
      opacity: 1;
    }
    
    .delete-btn:hover {
      color: #d93025;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #5f6368;
    }
    
    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    .system-notice {
  background: #fff8e1;
  border-bottom: 1px solid #f0e6c0;
  padding: 12px 16px;
  font-size: 13px;
  color: #5f6368;
}

.system-notice-title {
  font-weight: 600;
  color: #202124;
  margin-bottom: 4px;
}

.system-notice-body {
  margin-bottom: 6px;
}

.system-notice-btn {
  background: none;
  border: none;
  color: #1a73e8;
  cursor: pointer;
  font-size: 12px;
  padding: 0;
}

  </style>
</head>
<body>
  <div class="header">
    <h1>📬 Notification Feed</h1>
    <button class="clear-btn" id="clearAll">Clear All</button>
  </div>
  <!-- System capability notice -->
<div class="system-notice" id="capabilityNotice" style="display:none;">
  <div class="system-notice-title">
    ℹ️ Background notifications
  </div>
  <div class="system-notice-body">
    Some websites send notifications directly from the browser.
    NotifyPause can’t pause or read these, but will let you know when they happen.
  </div>
  <button class="system-notice-btn" id="dismissCapabilityNotice">
    Got it
  </button>
</div>

  <div class="feed" id="feed">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
      </svg>
      <div>No notifications yet</div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
